<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #7effb2;
      --accent2: #5bc8fa;
      --text: #e8e8f0;
      --muted: #555570;
      --bar-h: 48px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow: hidden;
    }

    /* ── Landing screen ── */
    #landing {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0;
      z-index: 10;
      transition: opacity .4s ease, transform .4s ease;
    }

    #landing.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-18px);
    }

    .wordmark {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 0.25em;
      user-select: none;
    }

    .tagline {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 3rem;
    }

    .search-wrap {
      position: relative;
      width: min(600px, 90vw);
    }

    #landing-input {
      width: 100%;
      height: 54px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 0 54px 0 20px;
      font-family: 'DM Mono', monospace;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      caret-color: var(--accent);
    }

    #landing-input::placeholder { color: var(--muted); }

    #landing-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(126,255,178,0.08);
    }

    .go-btn {
      position: absolute;
      right: 8px; top: 50%;
      transform: translateY(-50%);
      width: 38px; height: 38px;
      background: var(--accent);
      border: none; border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, transform .1s;
    }

    .go-btn:hover { background: #5affaa; }
    .go-btn:active { transform: translateY(-50%) scale(0.94); }

    .go-btn svg { width: 16px; height: 16px; fill: #0a0a0f; }

    .quick-links {
      display: flex; gap: 10px;
      margin-top: 1.4rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .quick-link {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
      user-select: none;
    }

    .quick-link:hover { color: var(--accent); border-color: var(--accent); }

    /* ── Browser chrome ── */
    #browser {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    #browser.visible {
      opacity: 1;
      pointer-events: all;
    }

    .bar {
      height: var(--bar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      gap: 8px;
      padding: 0 12px;
      flex-shrink: 0;
    }

    .nav-btn {
      width: 32px; height: 32px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s, border-color .15s;
      flex-shrink: 0;
    }

    .nav-btn:hover { color: var(--text); border-color: var(--accent); }
    .nav-btn svg { width: 14px; height: 14px; fill: currentColor; }

    #url-bar {
      flex: 1;
      height: 32px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 0 12px;
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--text);
      outline: none;
      transition: border-color .2s;
      caret-color: var(--accent);
    }

    #url-bar:focus { border-color: var(--accent); }

    .bar-go {
      height: 32px;
      padding: 0 14px;
      background: var(--accent);
      border: none; border-radius: 7px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      color: #0a0a0f;
      cursor: pointer;
      transition: background .15s;
      flex-shrink: 0;
    }

    .bar-go:hover { background: #5affaa; }

    .home-btn {
      width: 32px; height: 32px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s, border-color .15s;
      flex-shrink: 0;
    }
    .home-btn:hover { color: var(--accent); border-color: var(--accent); }
    .home-btn svg { width: 14px; height: 14px; fill: currentColor; }

    /* loading bar */
    #load-bar {
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%;
      transition: width .3s ease;
      flex-shrink: 0;
    }

    #frame {
      flex: 1;
      border: none;
      background: #fff;
    }

    /* ── Noise overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.025;
      pointer-events: none;
      z-index: 999;
    }

    /* grid lines behind landing */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(126,255,178,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(126,255,178,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    #landing { z-index: 5; }
  </style>
</head>
<body>

  <!-- Landing -->
  <div id="landing">
    <div class="wordmark">browse.</div>
    <div class="tagline">private · unrestricted · instant</div>
    <div class="search-wrap">
      <input id="landing-input" type="text" placeholder="Enter a URL or search term…" autocomplete="off" spellcheck="false" />
      <button class="go-btn" onclick="navigate()">
        <svg viewBox="0 0 16 16"><path d="M3 8h8.586l-2.293-2.293 1.414-1.414L14.414 8l-3.707 3.707-1.414-1.414L11.586 9H3V8z"/></svg>
      </button>
    </div>
    <div class="quick-links">
      <span class="quick-link" onclick="go('https://google.com')">Google</span>
      <span class="quick-link" onclick="go('https://youtube.com')">YouTube</span>
      <span class="quick-link" onclick="go('https://reddit.com')">Reddit</span>
      <span class="quick-link" onclick="go('https://wikipedia.org')">Wikipedia</span>
      <span class="quick-link" onclick="go('https://github.com')">GitHub</span>
    </div>
  </div>

  <!-- Browser UI -->
  <div id="browser">
    <div class="bar">
      <button class="nav-btn" onclick="goBack()" title="Back">
        <svg viewBox="0 0 16 16"><path d="M10.293 3.293 5.586 8l4.707 4.707 1.414-1.414L8.414 8l3.293-3.293z"/></svg>
      </button>
      <button class="nav-btn" onclick="goForward()" title="Forward">
        <svg viewBox="0 0 16 16"><path d="M5.707 3.293 10.414 8 5.707 12.707l-1.414-1.414L7.586 8 4.293 4.707z"/></svg>
      </button>
      <button class="nav-btn" onclick="reload()" title="Reload">
        <svg viewBox="0 0 16 16"><path d="M13.451 5.609c-.506-1.065-1.265-1.953-2.216-2.595A6.004 6.004 0 0 0 2.036 8H.026C.507 3.613 4.21.101 8.7.101c2.309 0 4.412.902 5.99 2.376L16 .167v5.604h-5.604l3.055-2.162zM2.549 10.391c.506 1.065 1.265 1.953 2.216 2.595A5.972 5.972 0 0 0 8.7 14.5a5.972 5.972 0 0 0 4.664-2.223A5.984 5.984 0 0 0 14.764 8h2.01C16.293 12.387 12.59 15.9 8.1 15.9a8.22 8.22 0 0 1-5.99-2.376L.8 15.834V10.23h5.604l-3.055 2.161z"/></svg>
      </button>
      <input id="url-bar" type="text" placeholder="Enter URL…" spellcheck="false"
        onkeydown="if(event.key==='Enter') navigateBar()" />
      <button class="bar-go" onclick="navigateBar()">Go</button>
      <button class="home-btn" onclick="goHome()" title="Home">
        <svg viewBox="0 0 16 16"><path d="M8 1 1 7h2v7h4v-4h2v4h4V7h2z"/></svg>
      </button>
    </div>
    <div id="load-bar"></div>
    <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock allow-downloads"></iframe>
  </div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────
    // Replace this with your actual Cloudflare Worker URL after deploying
    const WORKER_URL = 'https://billowing-recipe-e6ce.tsanghaakon.workers.dev/';
    // ────────────────────────────────────────────────────────

    const landing   = document.getElementById('landing');
    const browser   = document.getElementById('browser');
    const frame     = document.getElementById('frame');
    const urlBar    = document.getElementById('url-bar');
    const loadBar   = document.getElementById('load-bar');
    const landingInput = document.getElementById('landing-input');

    let history = [];
    let historyIndex = -1;

    function normalizeUrl(raw) {
      raw = raw.trim();
      if (!raw) return null;
      // If it looks like a search term, send to Google
      if (!raw.includes('.') || raw.includes(' ')) {
        return 'https://www.google.com/search?q=' + encodeURIComponent(raw);
      }
      return raw.startsWith('http') ? raw : 'https://' + raw;
    }

    function proxyUrl(url) {
      return WORKER_URL + '/browse?url=' + encodeURIComponent(url);
    }

    function go(url) {
      url = normalizeUrl(url);
      if (!url) return;

      // Show browser, hide landing
      landing.classList.add('hidden');
      browser.classList.add('visible');

      // Push history
      history = history.slice(0, historyIndex + 1);
      history.push(url);
      historyIndex = history.length - 1;

      urlBar.value = url;
      loadFrame(url);
    }

    function loadFrame(url) {
      // Animate load bar
      loadBar.style.width = '0%';
      setTimeout(() => { loadBar.style.width = '60%'; }, 50);
      frame.onload = () => {
        loadBar.style.width = '100%';
        setTimeout(() => { loadBar.style.width = '0%'; }, 400);
      };
      frame.src = proxyUrl(url);
    }

    function navigate() {
      const val = landingInput.value;
      if (val.trim()) go(val);
    }

    function navigateBar() {
      const val = urlBar.value;
      if (val.trim()) go(val);
    }

    function goBack() {
      if (historyIndex > 0) {
        historyIndex--;
        const url = history[historyIndex];
        urlBar.value = url;
        loadFrame(url);
      }
    }

    function goForward() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        const url = history[historyIndex];
        urlBar.value = url;
        loadFrame(url);
      }
    }

    function reload() {
      if (history[historyIndex]) loadFrame(history[historyIndex]);
    }

    function goHome() {
      browser.classList.remove('visible');
      landing.classList.remove('hidden');
      landingInput.value = '';
      setTimeout(() => { landingInput.focus(); }, 400);
    }

    // Enter key on landing input
    landingInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') navigate();
    });

    // Focus landing input on load
    window.addEventListener('load', () => landingInput.focus());
  </script>
</body>
</html>
